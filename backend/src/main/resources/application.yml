spring:
  application.name: slotmind
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:sqlite:${SLOTMIND_DB:slotmind.db}
    driver-class-name: org.sqlite.JDBC
    hikari.maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate.ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: never
slotmind:
  strategy: ${SLOTMIND_STRATEGY:RULE_BASED}
  ai:
    url: ${SLOTMIND_AI_URL:https://litellm-qc.zycus.net/v1/chat/completions}
    token: ${SLOTMIND_AI_TOKEN:}
    model: ${SLOTMIND_AI_MODEL:gpt-5.6-luna-azure-payg-global}
    product: ${SLOTMIND_AI_PRODUCT:PC1}
server.port: 8080
server.shutdown: graceful
management.endpoints.web.exposure.include: health,info
logging:
  level:
    com.slotmind: DEBUG
